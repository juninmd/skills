# Approved http(s) hosts for everything under .agents/skills.
#
# Enforced by .agents/tools/check-domains.mjs (`pnpm run domains:check`, part of
# `pnpm run validate`). A skill that cites a host missing here fails the build, and
# so does an entry no skill cites any more.
#
# Format (a strict TOML subset): "host" = "why a skill may cite it".
# Keys are exact lowercase hostnames. "*.domain" approves every subdomain but not
# the apex, which needs its own entry.
#
# [approved]      real sites: sources, documentation, registries, and APIs.
#                 Hosts an agent calls or installs from are marked "fetched".
# [placeholders]  example hosts that must never resolve to someone's server.
#                 Prefer the reserved example.com, .test, .local, or localhost.

[approved]
"12factor.net" = "The Twelve-Factor App, CLI and config conventions"
