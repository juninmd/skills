## ✅ Exemplo Completo (Values.yaml) - v1.4.4

```yaml
GatewayApi:
  provider: "envoy-gateway"
  grpc:
    enabled: true
    port: 50051

  internal:
    enabled: true
    hosts:
      - host: api-grpc.interno.luizalabs.com
    envoy:
      backendPolicy:
        enabled: true
        timeout:
          requestTimeout: 30s

rollouts:
  enabled: true
  strategy:
    type: Canary
    canary:
      steps:
        - setWeight: 10
        - pause: { duration: 5m }

referenceGrant:
  enabled: true
  allowedNamespaces:
    - namespace: "squad-b-namespace"
```