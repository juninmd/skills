# Guia de Configuração: Gateway API (GKE & Envoy)

Este documento orienta os desenvolvedores na configuração do `base-webapp` (v1.4.4) para utilizar as novas funcionalidades da Gateway API, incluindo o suporte híbrido para **GKE Gateway** (Google Cloud) e **Envoy Gateway** (Magalu Cloud).

## 🚀 Visão Geral

A partir da versão 1.4.2, o chart suporta múltiplos *providers* de Gateway API. Na versão **1.4.4**, foram adicionados suportes nativos para gRPC, Cross-Namespace Traffic Splitting e Argo Rollouts.

### Providers Disponíveis

| Provider | Código | Descrição | Status |
| :--- | :--- | :--- | :--- |
| **GKE Gateway** | `gke-gateway` | Utiliza o controlador nativo do Google Cloud. Padrão para manter retrocompatibilidade. | ✅ Estável (Default) |
| **Envoy Gateway** | `envoy-gateway` | Utiliza o Envoy Proxy como Gateway. Recomendado para Magalu Cloud (MGC). | ✅ Novo (v1.4.2) |
| **Auto Detection** | `auto` | Detecta automaticamente baseado nos CRDs disponíveis no cluster. | ✅ Novo (v1.4.2) |

---

## ⚙️ Selecionando o Provider

A escolha é feita através do campo `.Values.GatewayApi.provider`.

### Opção 1: GKE Gateway (Padrão)
Se você já utiliza o chart em produção no GCP e não quer mudar nada, **não é necessário fazer nenhuma alteração**.
O valor padrão já é `gke-gateway`.

```yaml
# values.yaml (Implícito ou Explícito)
GatewayApi:
  provider: "gke-gateway"
  internal:
    enabled: true
    hosts:
      - host: minha-app.interno.luizalabs.com
```
*Comportamento:* Renderiza `HealthCheckPolicy`, `GCPBackendPolicy` e `HTTPRoute` compatíveis com o GKE.

### Opção 2: Envoy Gateway (Novas Features)
Para utilizar o Envoy Gateway (MGC), defina o provider explicitamente.

```yaml
# values.yaml
GatewayApi:
  provider: "envoy-gateway"
  internal:
    enabled: true
    hosts:
      - host: minha-app.interno.luizalabs.com
```
*Comportamento:* Renderiza `BackendTrafficPolicy` e `HTTPRoute` otimizados para o Envoy.

---

## 🔥 Features de Tráfego e Resiliência (Envoy Gateway)

Ao utilizar `provider: "envoy-gateway"`, você desbloqueia configurações avançadas de tráfego e resiliência que são aplicadas via `BackendTrafficPolicy`.

### 1. gRPC Support (Novo v1.4.4)
O `base-webapp` agora suporta exposição de serviços gRPC via Gateway API. Isso inclui a criação automática de `HTTPRoute` com protocolo gRPC e `HealthCheckPolicy` específica.

```yaml
GatewayApi:
  grpc:
    enabled: true
    port: 50051
    # healthCheck: true  # Opcional: Ativa health check específico para gRPC (GKE)
```

### 2. Cross-Namespace Traffic Splitting (Novo v1.4.4)
Agora é possível fazer traffic split entre serviços em namespaces diferentes utilizando `ReferenceGrant`. Isso é útil para canary releases entre squads ou migrações graduais.

```yaml
# No Namespace RECEPTOR (quem recebe o tráfego)
referenceGrant:
  enabled: true
  allowedNamespaces:
    - namespace: "namespace-origem"

# No Namespace ORIGEM (quem envia o tráfego)
GatewayApi:
  advanced: true
  internal:
    backendRefs:
      - name: meu-servico-local
        port: 80
        weight: 90
      - name: servico-remoto
        namespace: namespace-receptor
        port: 80
        weight: 10
```

### 3. Argo Rollouts (Novo v1.4.4)
Suporte integrado para estratégias de deployment **Canary** e **Blue-Green** via Argo Rollouts.

```yaml
rollouts:
  enabled: true
  strategy:
    type: Canary
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 1h }
        - setWeight: 50
        - pause: { duration: 1h }
```

### 4. Redirecionamento HTTP -> HTTPS
No Envoy Gateway, você pode forçar o redirecionamento de tráfego HTTP para HTTPS de forma simples, adicionando o parâmetro `httpRedirect: true` na definição do host.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  external:
    enabled: true
    hosts:
      - host: minha-app.magazineluiza.com.br
        httpRedirect: true
```

### 5. Resiliência e Timeouts (Atualizado v1.4.4)
Controle granular sobre timeouts, proteção contra sobrecarga e retries automáticos.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  internal:
    enabled: true
    hosts:
      - host: app.local
    envoy:
      backendPolicy:
        enabled: true
        timeout:
          requestTimeout: 30s
          connectionIdleTimeout: 590s
        circuitBreaker:
          enabled: true
          maxConnections: 16384
        retryOn:
          enabled: true
          triggers:
            - "reset"
            - "connect-failure"
            - "retriable-status-codes"
          httpStatusCodes:
            - 502
            - 504
        numRetries: 1
```

