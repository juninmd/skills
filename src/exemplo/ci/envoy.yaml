## 🛡️ Features do GKE Gateway

Ao utilizar `provider: "gke-gateway"`, você tem acesso às funcionalidades nativas do Google Cloud Platform.

### 1. Health Check Policy
O GKE Gateway utiliza `HealthCheckPolicy` para configurar health checks ativos, similares aos do Envoy mas utilizando a infraestrutura do GCP.

```yaml
# Configurado automaticamente baseado no seu livenessProbe
livenessProbe:
  httpGet:
    path: /health
    port: 5000
  periodSeconds: 10
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
```
*Comportamento:* Cria uma `HealthCheckPolicy` que monitora o endpoint `/health` a cada 10 segundos.

### 2. GCP Backend Policy
Configurações avançadas de backend como timeout, logging e connection draining.

```yaml
# Configurações globais (aplicam a todos os gateways)
GatewayApiBackend:
  timeout:
    enable: true
    time: 30  # Timeout em segundos

GatewayApiBackendLogging:
  logging:
    external:
      enable: true
      sampleRate: 0.1  # 10% das requests são logadas

GatewayApiBackendDrainingTimeoutSec:
  timeout:
    external:
      time: 30  # Tempo para draining de conexões
```

### 3. Cloud Armor (Security Policy)
Integração com Google Cloud Armor para proteção contra ataques DDoS, SQL injection, XSS, etc.

```yaml
GatewayApiArmor:
  armor:
    enabled: true
    policy:
      - name: "my-security-policy"  # Nome da policy no Cloud Armor
```

---

##  Resumo de Migração (GKE -> Envoy)

Se você deseja migrar uma aplicação do GKE para um cluster com Envoy Gateway:

1.  Altere `GatewayApi.provider` para `"envoy-gateway"` ou `"auto"`.
2.  Mantenha as configurações de `hosts`.
3.  Se precisar de **HTTPS forçado** para rotas externas, adicione `httpRedirect: true`.
4.  Adicione o bloco `envoy.backendPolicy` para configurar timeouts, circuit breakers ou sticky sessions.
5.  **Atenção:** Se você usava `GatewayApiArmor` (Cloud Armor), ele **não** será renderizado no Envoy Gateway, pois é uma feature proprietária do Google.

## ✅ Exemplo Completo (Values.yaml) - Atualizado v1.4.2

```yaml
GatewayApi:
  provider: "envoy-gateway"
  advanced: false  # false = usa service padrão, true = traffic splitting manual

  # Exposição Interna (HTTP) + Sticky Session + Circuit Breaker + Retry
  internal:
    enabled: true
    hosts:
      - host: checkout-api.interno.luizalabs.com
    envoy:
      backendPolicy:
        enabled: true
        sessionAffinity: true
        timeout:
          requestTimeout: 30s
          connectionIdleTimeout: 590s  # Aumentado para conexões longas
        circuitBreaker:
          enabled: true
          maxConnections: 16384        # Proteção contra sobrecarga
        retryOn:
          enabled: true
          triggers:
            - "reset"
            - "connect-failure"
            - "refused-stream"
            - "retriable-status-codes"
            - "retriable-4xx"
          httpStatusCodes:
            - 502
            - 504
        numRetries: 1

  # Exposição Externa (HTTPS) + Redirect + Headers
  external:
    enabled: true
    hosts:
      - host: checkout.magazineluiza.com.br
        httpRedirect: true
    envoy:
      responseHeaders:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains"
      backendPolicy:
        enabled: true
        retryOn:
          enabled: true
          triggers:
            - "reset"
            - "connect-failure"
            - "refused-stream"
            - "retriable-status-codes"
            - "retriable-4xx"
          httpStatusCodes:
            - 502
            - 504

# Configurações específicas do GKE (apenas quando provider="gke-gateway")
GatewayApiArmor:
  armor:
    enabled: true
    policy:
      - name: "my-security-policy"

GatewayApiBackendLogging:
  logging:
    external:
      enable: true
      sampleRate: 0.01  # 1% das requests
```