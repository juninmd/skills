## 🔥 Features Exclusivas do Envoy Gateway

Ao utilizar `provider: "envoy-gateway"`, você desbloqueia configurações avançadas de tráfego e resiliência que são aplicadas via `BackendTrafficPolicy`.

Essas configurações ficam dentro dos blocos `envoy` em `external` ou `internal`.

### 1. Redirecionamento HTTP -> HTTPS
No Envoy Gateway, você pode forçar o redirecionamento de tráfego HTTP para HTTPS de forma simples, adicionando o parâmetro `httpRedirect: true` na definição do host.

A implementação cria um filtro `RequestRedirect` com status `301` e scheme `https`.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  external:
    enabled: true
    hosts:
      - host: minha-app.magazineluiza.com.br
        # Força redirect HTTP -> HTTPS (Status 301)
        httpRedirect: true
```
*Nota:* Ao ativar, o chart gera duas rotas: uma para o tráfego seguro (HTTPS) e outra exclusiva para receber HTTP e responder com o Redirect.

### 2. Resiliência e Timeouts (Atualizado v1.4.2)
Controle granular sobre timeouts, proteção contra sobrecarga e retries automáticos.

*Nota sobre Health Checks:* O Envoy Gateway **não** realiza health checks ativos separados. Ele utiliza o status dos pods do Kubernetes (Ready/NotReady) baseado no `livenessProbe` configurado. Isso evita duplicação de métricas no Datadog e requisições redundantes aos endpoints de saúde.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  internal:
    enabled: true
    hosts:
      - host: app.local
    envoy:
      backendPolicy:
        enabled: true
        timeout:
          # Timeout total da requisição (do gateway até a app e volta)
          requestTimeout: 30s
          # Timeout para estabelecer conexão TCP
          tcp:
            connectTimeout: 10ms
          # Timeout de conexão ociosa (Keep-Alive) - Aumentado para conexões longas
          connectionIdleTimeout: 590s
          # Máximo tempo de duração da conexão (draining)
          maxConnectionDuration: 3600s

        # Proteção contra efeito manada (Circuit Breaker) - Novo em v1.4.2
        circuitBreaker:
          enabled: true
          maxConnections: 16384           # Máx conexões simultâneas (padrão: 16384)
          maxPendingRequests: 16384       # Máx requisições na fila (padrão: 16384)
          maxParallelRequests: 16384      # Máx requests paralelos (padrão: 16384)
          maxParallelRetries: 16384       # Máx retries paralelos (padrão: 16384)

        # Retry automático em falhas - HABILITADO POR PADRÃO em v1.4.2
        retryOn:
          enabled: true                   # Habilita/desabilita retries (padrão: true)
          triggers:                       # Condições para retry
            - "reset"                     # Connection reset (network glitch)
            - "connect-failure"           # Failed to connect to upstream
            - "refused-stream"            # Stream refused by upstream
            - "retriable-status-codes"    # Retry specific HTTP status codes
            - "retriable-4xx"             # Retry on 429 (rate limit)
          httpStatusCodes:                # Status codes explícitos para retry
            - 502                         # Bad Gateway (intermediate proxy error)
            - 504                         # Gateway Timeout (upstream timeout)
            # NOT 503 (Service Unavailable) - previne retry storm durante overload
        numRetries: 1                     # Número de tentativas extras (total: 2 tentativas)

*Nota:* A configuração de retry é **explícita e segura**:
- **Retenta:** 502 (Bad Gateway), 504 (Gateway Timeout), 429 (Rate Limit), network issues (reset, connect-failure, refused-stream)
- **NÃO retenta:** 503 (Service Unavailable) para prevenir retry storm durante Black Friday, 500 (pode ser bug da app), 409 (Conflict - evita operações duplicadas)
```

*Novidades v1.4.2:*
- **Health Check Simplificado**: Removido active health checking do Envoy para evitar duplicação com Kubernetes livenessProbe.
- **Retry Seguro**: Retry automático (1 tentativa extra) apenas em erros seguros (502, 504, network issues). **NÃO retenta 503** (previne retry storm).
- **Circuit Breaker Global**: Limites altos (16384) para prevenir RST errors e latência variável.
- **Timeouts Otimizados**: `connectionIdleTimeout: 600s` e `maxConnectionDuration: 3600s` para conexões longas em produção.

### 3. Session Affinity (Sticky Sessions)

Para aplicações que necessitam que um usuário seja sempre roteado para o mesmo pod (ex: aplicações stateful ou com caches locais), você pode ativar a afinidade de sessão.

O Chart utiliza o algoritmo `ConsistentHash` baseado no IP de origem (`SourceIP`) do cliente.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  internal:
    enabled: true
    hosts:
      - host: app-stateful.interno.luizalabs.com
    envoy:
      backendPolicy:
        enabled: true
        # Ativa Sticky Session por IP de Origem
        sessionAffinity: true
```

### 4. Manipulação de Headers
Adicione ou remova headers nas respostas enviadas ao cliente.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  external:
    enabled: true
    hosts:
      - host: checkout.magazineluiza.com.br
    envoy:
      responseHeaders:
        - name: "X-Powered-By"
          value: "Magalu-Envoy"
        - name: "Cache-Control"
          value: "no-store"
```

### 5. Traffic Splitting (Modo Avançado)
Para cenários avançados de deployment (canary releases, A/B testing, etc.), você pode habilitar o modo avançado para distribuir tráfego entre múltiplos backends com pesos específicos.

```yaml
GatewayApi:
  provider: "envoy-gateway"
  advanced: true  # Habilita modo avançado

  external:
    enabled: true
    hosts:
      - host: minha-app.magazineluiza.com.br
    # No modo avançado, você define manualmente os backendRefs
    backendRefs:
      - name: minha-app-v1     # Service do backend principal
        port: 80
        weight: 90            # 90% do tráfego
      - name: minha-app-v2     # Service do backend canary
        port: 80
        weight: 10            # 10% do tráfego
```
*Nota:* Quando `advanced: true`, o chart ignora o service padrão e usa apenas os `backendRefs` definidos.

