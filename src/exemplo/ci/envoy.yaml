# Guia de Configuração: Gateway API (GKE & Envoy)

Este documento orienta os desenvolvedores na configuração do `base-webapp` (v1.4.2) para utilizar as novas funcionalidades da Gateway API, incluindo o suporte híbrido para **GKE Gateway** (Google Cloud) e **Envoy Gateway** (Magalu Cloud).

## 🚀 Visão Geral

A partir da versão 1.4.2, o chart suporta múltiplos *providers* de Gateway API. Isso permite que a mesma aplicação seja implantada em diferentes ambientes (GKE ou Clusters On-Prem/MGC) apenas alterando uma configuração no `values.yaml`, sem reescrever templates.

### Providers Disponíveis

| Provider | Código | Descrição | Status |
| :--- | :--- | :--- | :--- |
| **GKE Gateway** | `gke-gateway` | Utiliza o controlador nativo do Google Cloud. Padrão para manter retrocompatibilidade. | ✅ Estável (Default) |
| **Envoy Gateway** | `envoy-gateway` | Utiliza o Envoy Proxy como Gateway. Recomendado para Magalu Cloud (MGC). | ✅ Novo (v1.4.2) |
| **Auto Detection** | `auto` | Detecta automaticamente baseado nos CRDs disponíveis no cluster. | ✅ Novo (v1.4.2) |

---

## ⚙️ Selecionando o Provider

A escolha é feita através do campo `.Values.GatewayApi.provider`.

### Opção 1: GKE Gateway (Padrão)
Se você já utiliza o chart em produção no GCP e não quer mudar nada, **não é necessário fazer nenhuma alteração**.
O valor padrão já é `gke-gateway`.

```yaml
# values.yaml (Implícito ou Explícito)
GatewayApi:
  provider: "gke-gateway"
  internal:
    enabled: true
    hosts:
      - host: minha-app.interno.luizalabs.com
```
*Comportamento:* Renderiza `HealthCheckPolicy`, `GCPBackendPolicy` e `HTTPRoute` compatíveis com o GKE.

### Opção 2: Envoy Gateway (Novas Features)
Para utilizar o Envoy Gateway (MGC), defina o provider explicitamente.

```yaml
# values.yaml
GatewayApi:
  provider: "envoy-gateway"
  internal:
    enabled: true
    hosts:
      - host: minha-app.interno.luizalabs.com
```
*Comportamento:* Renderiza `BackendTrafficPolicy` e `HTTPRoute` otimizados para o Envoy.

### Opção 3: Auto Detection
Para ambientes híbridos onde você quer que o chart detecte automaticamente qual provider usar baseado nos CRDs disponíveis:

```yaml
# values.yaml
GatewayApi:
  provider: "auto"
  internal:
    enabled: true
    hosts:
      - host: minha-app.hibrido.luizalabs.com
```
*Comportamento:* Detecta automaticamente se deve usar GKE ou Envoy baseado na presença dos CRDs no cluster.

