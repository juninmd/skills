base-webapp:
  squad: comercial
  tribe: comercial
  vertical: operacoes
  product: arguinho
  replicaCount: 0
  image:
    repository: gcr.io/magalu-cicd/code-quality
    tag: v1.92.2
    pullPolicy: IfNotPresent
  command: node
  args:
    - dist/src/main.js
  resources:
    limits:
      cpu: 800m
      memory: 3Gi
    requests:
      cpu: 400m
      memory: 500Mi
  ingress:
    ingressController:
      internal:
        enabled: true
        annotations:
          konghq.com/protocol: https
          konghq.com/https-redirect-status-code: '308'
        ingressClassName: internal
        hosts:
          - host: code-quality.luizalabs.com
            paths:
              - /*
  livenessProbe:
    failureThreshold: 10
    httpGet:
      path: /
    initialDelaySeconds: 15
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 10
    httpGet:
      path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 5
  hpa:
    enabled: true
    targetMetric:
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
    minReplicas: 3
    maxReplicas: 8
  maxUnavailable: 0
  maxSurge: 1
  lifecycle:
    preStop:
      exec:
        command:
          - sleep
          - '30'
  secretFiles:
    enabled: false
  secretEnvs:
    enabled: false
  envs:
    - name: NODE_OPTIONS
      value: '--max-old-space-size=4096 --max-semi-space-size=512'
    - name: TZ
      value: America/Sao_Paulo
    - name: NODE_ENV
      value: production
    - name: PORT
      value: '5000'
    - name: GMUDID
      value: '2597'
    - name: HOSTGITLABAPI
      value: https://gitlab.luizalabs.com/api/v4
    - name: HOSTSONARAPI
      value: https://sonarqube.luizalabs.com/api
    - name: ATENA_API_URL
      value: https://atena.luizalabs.com
    - name: SECURTIFY_JOB_NAMES
      value: fortify,security,code-analysis
    - name: RELEASE_JOB_NAMES
      value: release
    - name: SONAR_JOB_NAMES
      value: sonar
    - name: GMUD_JOB_NAMES
      value: gmud
    - name: DEPLOY_JOB_NAMES
      value: deploy
    - name: ROLLBACK_JOB_NAMES
      value: rollback
    - name: DO_NOT_SILENCE_GOOGLE_APPLICATION_CREDENTIALS
      value: 'true'
    - name: CRON_TIME
      value: 0 6 * * *
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: service.tier=OTHERS
    - name: OTEL_SERVICE_NAME
      value: '[MGC] code-quality'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://opentelemetry-collector-internal.luizalabs.com:4317
    - name: OTEL_LOG_LEVEL
      value: ERROR
    - name: OTEL_ENABLE
      value: 'false'
    - name: OTEL_TRACES_EXPORTER
      value: otlp
    - name: OTEL_METRICS_EXPORTER
      value: otlp
    - name: OTEL_EXPORTER_OTLP_HEADERS
      value: Authorization=Basic%20Z3N4LXJwa3QtcnN6OnhvcS1zc3JiLXR5bg%3D%3D
    - name: BURZUM_ENABLED
      value: 'false'
    - name: OTEL_EXPORTER_OTLP_INSECURE
      value: 'true'
    - name: CRIPTO_KEY
      value: gcp:secretmanager:projects/243428398695/secrets/CODE-QUALITY_PRD_CRIPTO_KEY/versions/1
    - name: JWT_SECRET
      value: gcp:secretmanager:projects/243428398695/secrets/CODE-QUALITY_PRD_JWT_SECRET/versions/1
    - name: BURZUM_APP_INDEX
