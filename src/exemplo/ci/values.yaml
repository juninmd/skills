    - name: MAPA_LABS_API_TOKEN
      value: gcp:secretmanager:projects/243428398695/secrets/CODE-QUALITY_PRD_MAPA_LABS_API_TOKEN/versions/1
    - name: REDIS_ENABLE
      value: 'true'
