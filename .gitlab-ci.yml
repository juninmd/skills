image: node:24-slim

stages:
  - validate
  - report
  - install
  - deploy
  - tag
  - rollback

variables:
  TZ: "/usr/share/zoneinfo/America/Sao_Paulo"
  PNPM_VERSION: "10.32.1"
  DOCKER_REPO: gcr.io/magalu-cicd/tribe-ipet/padrao-labs-agents
  ARGOCD_SERVER: argocd-ipet.ipet.sh
  ARGOCD_NAMESPACE: cicd/tribe-ipet
  ARGOCD_BRANCH: master
  DEPLOY_TAG: ${CI_COMMIT_SHORT_SHA}

.setup-pnpm:
  image: node:24-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: pnpm-v2
    paths:
      - node_modules/
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm install --frozen-lockfile --ignore-scripts

commitlint:
  stage: install
  image: $CIKNIFE_IMAGE
  script: ci-knife commitlint
  only:
    - merge_requests
  when: always

unit_tests:
  extends: .setup-pnpm
  stage: validate
  script:
    - pnpm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - apps/docs/coverage/
      - cli/coverage/
    reports:
      junit:
        - apps/docs/coverage/junit.xml
        - cli/coverage/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: "*/coverage/cobertura-coverage.xml"
  only:
    - merge_requests
    - main
    - branches

lint_code:
  extends: .setup-pnpm
  stage: validate
  script:
    - pnpm run lint
  only:
    - merge_requests

build_frontend:
  extends: .setup-pnpm
  stage: install
  script:
    - pnpm --filter ./apps/docs run build
    - mkdir -p public
    - cp -rf apps/docs/docs/.vitepress/dist/* public/
  artifacts:
    paths:
      - apps/docs/docs/
      - public/
    expire_in: 1 day
  only:
    - merge_requests
    - main
    - branches

build_cli:
  extends: .setup-pnpm
  stage: install
  script:
    - cd cli
    - pnpm run build
    - pnpm run bundle-agents
  artifacts:
    paths:
      - cli/dist/
      - cli/agents-bundle/
    expire_in: 1 day
  only:
    - tags

create_release:
  stage: tag
  image: $CIKNIFE_IMAGE
  allow_failure: false
  script:
    - ci-knife create-release -n
  only:
    - main
  except:
    changes:
      - CHANGELOG.md

deploy_argo:
  image: $CIKNIFE_IMAGE
  stage: deploy
  allow_failure: true
  services:
    - docker:26-dind
  script: ci-knife argocd-deploy --no-msg --docker-image
  only:
    - tags
  when: always
  tags:
    - global-docker-tls

rollback_argo_production:
  image: $CIKNIFE_IMAGE
  stage: rollback
  services:
    - docker:26-dind
  script: ci-knife argocd-rollback --no-msg
  only:
    refs:
      - tags
  when: manual
  dependencies:
    - deploy_argo
  tags:
    - global-docker-tls

security_gate:
  stage: report
  image: $CIKNIFE_IMAGE
  script:
    - ci-knife security-scanner
  only:
    - branches
  except:
    changes:
      - CHANGELOG.md
  allow_failure: true

sonar:
  stage: install
  image: $CIKNIFE_IMAGE
  script:
    - ci-knife sonar-scanner
  variables:
    SONAR_URL: $SONAR_URL
    SONAR_ANALYSIS_MODE: publish
    SONAR_TOKEN: $SONAR_TOKEN
  only:
    - tags
  except:
    changes:
      - CHANGELOG.md
