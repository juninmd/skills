name: Validate
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Spell check Markdown
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            README.md
            docs/**/*.md
            .agents/AGENTS.md
            .agents/skills/**/*.md

      - name: Link check Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --fallback-extensions md
            README.md
            "docs/**/*.md"
            ".agents/AGENTS.md"
            ".agents/skills/**/*.md"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.34.5

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run dependencies:check
      - run: pnpm run validate

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Official Agent Skills spec validator
        run: for skill in .agents/skills/*/; do uvx --from skills-ref==0.1.1 agentskills validate "$skill"; done
      - run: pnpm run docs:build

      - name: PR Skill completeness check and diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          pnpm run pr:check
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Comment PR with Skill changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (success() || failure())
        continue-on-error: true
        run: |
          if [ -f pr-comment.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} -F pr-comment.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
