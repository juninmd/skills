name: Central Validate PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  validate:
    uses: juninmd/base-actions/.github/workflows/reusable-validate.yml@main
