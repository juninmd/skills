name: Security Scan

on:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  gitleaks:
    uses: juninmd/base-actions/.github/workflows/reusable-security-scan.yml@main
