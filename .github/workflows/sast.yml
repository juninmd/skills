name: SAST

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  sast:
    uses: juninmd/base-actions/.github/workflows/reusable-sast.yml@main
    with:
      # Relatorio no primeiro ciclo; aperte para true depois do triage.
      fail-semgrep: false
